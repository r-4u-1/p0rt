name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs against the placeholders in src/content/, which is what the
      # component tests are written for.
      - name: Unit tests
        run: npm test

      # The real site content lives in the SITE_CONTENT repository secret, as
      # one JSON document: { "en": {...}, "sv": {...} }. Without the secret the
      # placeholders are deployed. --quiet keeps failing values out of the log.
      - name: Check site content
        run: node scripts/check-content.mjs --quiet
        env:
          SITE_CONTENT: ${{ secrets.SITE_CONTENT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        # Pages serves the site from /<repo>/ unless a custom domain is set,
        # so the Vite base is derived from the repository name at build time.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          SITE_CONTENT: ${{ secrets.SITE_CONTENT }}

      - name: Add SPA/404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
